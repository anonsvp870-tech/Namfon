let ac;function A(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()}
function tone(f,d,v,ty){if(!ac)return;const o=ac.createOscillator(),n=ac.createGain();o.type=ty||'sine';o.frequency.value=f;n.gain.value=v;o.connect(n);n.connect(ac.destination);o.start();n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}
function noise(d,v,fr){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=ac.createBufferSource(),n=ac.createGain(),f=ac.createBiquadFilter();f.frequency.value=fr||2000;s.buffer=b;n.gain.value=v;s.connect(f);f.connect(n);n.connect(ac.destination);s.start()}
function scream(){if(!ac)return;noise(1.8,.7,4500);[700,1100,520].forEach(f=>{const o=ac.createOscillator(),n=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.4,ac.currentTime+1.5);n.gain.value=.22;o.connect(n);n.connect(ac.destination);o.start();n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.6);o.stop(ac.currentTime+1.6)})}
let drone;function drn(on){if(on&&ac&&!drone){drone=ac.createOscillator();const n=ac.createGain();drone.frequency.value=44;drone.type='sawtooth';n.gain.value=.02;drone.connect(n);n.connect(ac.destination);drone.start()}else if(!on&&drone){try{drone.stop()}catch(e){}drone=null}}
// screens
function show_(id){document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));if(id)$(id).classList.add('on')}
$('lg').onclick=()=>{A();$('lg').style.display='none';const L=['> เชื่อมต่อระบบรักษาความปลอดภัย... OK','> CAM 1 บันไดหลัก ......... ONLINE','> CAM 2 ห้องเรียน .......... ONLINE','> CAM 3 ทางเดินชั้น 3 ...... ONLINE','> CAM 4 ทางเดินปีกตะวันตก .. ONLINE','> CAM 5 ห้องน้ำ ............ ONLINE','> ตรวจพบสิ่งผิดปกติในอาคาร...'];let i=0;const b=$('boot');
 const iv=setInterval(()=>{b.textContent+=(i?'\n':'')+L[i];tone(900,.04,.05,'square');i++;if(i>=L.length){clearInterval(iv);setTimeout(()=>{show_('s2');b.textContent='';$('lg').style.display=''},900)}},260)};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{A();start(+b.dataset.d)});
$('rt').onclick=()=>show_('s2');
// game
const cv=$('c'),g=cv.getContext('2d'),cw=$('cw'),cb=$('cams');
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.textContent='CAM '+(i+1);b.onclick=()=>pick(i);cb.appendChild(b)});
let run=0,cfg,cur=0,GH=[],caught=0,t=0,last=0,scare=0,spawnAt=0,hb=0,bp=0,fr=0,CX=[],S=1,sty=0;
function rs(){const d=Math.min(devicePixelRatio||1,1.5);cv.width=cw.clientWidth*d;cv.height=cw.clientHeight*d}
addEventListener('resize',rs);
function pick(i){if(!run)return;cur=i;tone(500,.06,.08,'square');noise(.2,.12,1500);[...cb.children].forEach((b,k)=>b.classList.toggle('sel',k===i))}
function start(d){cfg=CFG[d];GH=[];caught=0;cur=0;t=0;scare=0;spawnAt=3;run=1;CX=IM.map(i=>i.w0);show_(null);rs();drn(1);pick(0);
 const h=$('hh');h.textContent='◀ ลากเพื่อหันกล้อง ▶  หาผีแล้วแตะที่ผี!';h.style.opacity=1;setTimeout(()=>h.style.opacity=0,5000)}
function place(o){const tk=GH.filter(x=>x!==o).map(x=>x.r+'-'+x.s);let r,s;do{r=Math.random()*5|0;s=Math.random()*3|0}while(tk.includes(r+'-'+s));o.r=r;o.s=s}
function spawn(){const o={t0:t,ph:rn(6),stare:0,ty:Math.random()<.5?0:1,mv:t+(cfg.mv||999),vis:0,sx:0,sy:0,sw:0,sh:0};GH.push(o);place(o)}
function lose(){if(!run)return;run=0;drn(0);scare=1.9;scream();$('hh').style.opacity=0;$('hs').textContent=''}
function win(){run=0;drn(0);$('hs').textContent='';const e=$('t3');e.textContent=e.dataset.t='06:00 น.';$('msg').textContent='คุณรอดแล้ว… ผีกลับไปแล้ว คืนนี้';show_('s3')}
// input: drag to pan, tap to catch
let dn=null;
cw.addEventListener('pointerdown',e=>{cw.setPointerCapture(e.pointerId);dn={x:e.clientX,y:e.clientY,t:performance.now(),m:0}});
cw.addEventListener('pointermove',e=>{if(!dn||!run)return;const r=cv.width/cw.clientWidth,dx=e.clientX-dn.x;dn.m+=Math.abs(dx)+Math.abs(e.clientY-dn.y);CX[cur]-=dx*r/S;dn.x=e.clientX;dn.y=e.clientY});
cw.addEventListener('pointerup',e=>{if(dn&&run&&dn.m<10&&performance.now()-dn.t<450)tap(e);dn=null});
function tap(e){const r=cw.getBoundingClientRect(),k=cv.width/r.width,tx=(e.clientX-r.left)*k,ty=(e.clientY-r.top)*k;
 for(const o of GH)if(o.r===cur&&o.al>.15&&Math.abs(tx-o.sx)<o.sw*.62&&Math.abs(ty-o.sy)<o.sh*.62){GH.splice(GH.indexOf(o),1);caught++;noise(.5,.3,800);tone(90,.4,.3,'sawtooth');
  const f=$('fl');f.style.transition='none';f.style.opacity=.8;requestAnimationFrame(()=>{f.style.transition='opacity .5s';f.style.opacity=0});spawnAt=t+cfg.gap[0]+rn(cfg.gap[1]-cfg.gap[0]);if(caught>=cfg.need)win();return}}
function bgScene(){const Wc=cv.width,Hc=cv.height,im=IM[cur],w0=im.w0,h0=im.h;S=Math.max(Wc/w0,Hc/h0);const vw=Wc/S,lo=Math.max(w0*.5,vw/2),hi=Math.min(w0*1.5,im.w-vw/2);
 CX[cur]=cl(CX[cur],Math.min(lo,hi),Math.max(lo,hi));const left=CX[cur]-vw/2,top=(Hc-h0*S)/2;
 const X=p=>(p-left)*S,Y=p=>top+p*S;g.drawImage(im.img,-left*S,top,im.w*S,h0*S);return{X,Y,left,top,w0,h0,im}}
const nx=$('nz').getContext('2d'),nid=nx.createImageData(160,100);
function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-last)/1000||0,.05);last=ts;fr++;
 if(fr%2==0){const d=nid.data;for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=Math.random()*255;d[i+3]=255}nx.putImageData(nid,0,0)}
 if(!IM.length||(!run&&scare<=0))return;const Wc=cv.width,Hc=cv.height;
 if(scare>0){scare-=dt;const k=cl(1-scare/1.9,0,1),im=GI[Math.random()<.5?0:1];g.fillStyle='#000';g.fillRect(0,0,Wc,Hc);
  const sc=(.4+Math.min(1,k*7)*1.3)*Hc/im.height*1.1,w=im.width*sc,h=im.height*sc;g.drawImage(im,Wc/2-w/2+(Math.random()-.5)*28*k,Hc*.5-h/2+(Math.random()-.5)*28*k,w,h);
  g.fillStyle=`rgba(200,0,0,${.15+Math.random()*.3})`;g.fillRect(0,0,Wc,Hc);
  if(scare<=0){const e=$('t3');e.textContent=e.dataset.t='YOU DIED';$('msg').textContent='ผีเจอคุณก่อน… ต้องแตะที่ผีให้ทัน';show_('s3')}return}
 t+=dt;
 if(GH.length<cfg.n&&t>=spawnAt&&caught+GH.length<cfg.need)spawn();
 const sc=bgScene(),{X,Y,w0,h0,im}=sc;let dang=0;
 for(const o of GH){const p=(t-o.t0)/cfg.pat;dang=Math.max(dang,p);if(p>=1){lose();return}
  const sp=SP[o.r][o.s],s=Math.sin(t*2.1+o.ph)+Math.sin(t*.73+o.ph*2);
  o.vis=cfg.vis*(cfg.fk==0?.9+.1*Math.sin(t*2+o.ph):cfg.fk==1?cl((s+1)*.7,0,1):cl((s+.3)*1.5,0,1));o.al=o.vis*sp.dim;
  const gi=GI[o.ty],asp=gi.height/gi.width,grow=1+.6*cl(p,0,1);
  o.sw=sp.w*w0*S*grow;o.sh=o.sw*asp;o.sx=X((.5+sp.u)*w0)+Math.sin(t*.9+o.ph)*2;o.sy=Y(sp.v*h0)+Math.sin(t*1.3+o.ph)*1.5;
  if(o.r===cur){g.globalAlpha=cl(o.al,0,1);g.drawImage(gi,o.sx-o.sw/2,o.sy-o.sh/2,o.sw,o.sh);g.globalAlpha=1;
   if(sp.occ){const[a,b,c,d]=sp.occ;g.save();g.beginPath();g.rect(X((.5+a)*w0),Y(b*h0),(c-a)*w0*S,(d-b)*h0*S);g.clip();g.drawImage(im.img,-sc.left*S,sc.top,im.w*S,h0*S);g.restore()}}
  if(o.r===cur&&o.al>.25&&o.sx>0&&o.sx<Wc){o.stare+=dt;if(o.stare>cfg.stare){lose();return}}else o.stare=Math.max(0,o.stare-dt*.5);
  if(cfg.mv&&t>o.mv&&o.r!==cur){place(o);o.mv=t+cfg.mv+rn(4)}}
 // alert (ไม่บอกกล้อง) + heartbeat
 const al=GH.length>0;bp-=dt;if(al&&bp<=0){tone(1000+dang*500,.09,.13,'square');bp=Math.max(.22,1.1-.85*dang)}
 hb-=dt;if(hb<=0&&ac){const v=.05+.28*dang;tone(58,.16,v);setTimeout(()=>tone(50,.14,v*.7),170);hb=(al?1.2-.85*dang:1.6)}
 // heat vignette when danger high
 if(dang>.6){g.fillStyle=`rgba(180,0,0,${(dang-.6)*.35*(.6+.4*Math.sin(t*14))})`;g.fillRect(0,0,Wc,Hc)}
 $('hn').textContent=NAMES[cur];$('hr').textContent=((fr>>5)&1?'● ':'  ')+'REC';$('hs').textContent=al&&((fr>>3)&1)?'⚠ SIGNAL':'';
 const pr=caught/cfg.need,hh=Math.floor(pr*6),mm=Math.floor((pr*6-hh)*60);$('ht').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} AM`;$('hc').textContent=`จับผี ${caught}/${cfg.need}`}
requestAnimationFrame(loop);
</script></body></html>
